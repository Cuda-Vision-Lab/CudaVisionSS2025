name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Release Folder
        run: |
          mkdir release-files
          # Copy your python scripts and notebooks
          cp *.py *.ipynb release-files/ 2>/dev/null || :
          zip -r project-v${{ github.ref_name }}.zip release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CudaVision ${{ github.ref_name }}"
          files: project-v${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}